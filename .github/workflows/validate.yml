name: Andy Speed plugin validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and safety harness
        run: |
          php -l andy-speed.php
          php tests/safety-harness.php
          php tests/contract-harness.php
          php tests/byl-css-bundle-contract.php
      - name: Validate reproducible WordPress ZIP
        run: |
          mkdir -p build/andy-speed
          cp andy-speed.php README.md build/andy-speed/
          cp -R assets build/andy-speed/
          cd build
          zip -qr ../andy-speed-preview.zip andy-speed
          unzip -t ../andy-speed-preview.zip
